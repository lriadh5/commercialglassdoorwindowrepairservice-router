[build]
  command = "npm run build && node scripts/prerender-seo.js"
  publish = "dist"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"


# Every real route (/, /service/*, /city/*, /foggy-city/*, /pages/*, /blog*,
# /gallery, /contact, /foggy-window) has its own static index.html written
# by scripts/prerender-seo.js, so Netlify serves those directly -- static
# files are matched before redirects, so this catch-all only ever fires for
# a path with no matching file, i.e. a genuinely invalid URL. It now returns
# a real 404 (dist/404.html, noindexed) instead of soft-404ing every
# unmatched path to the homepage with status 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
